[project]
name = "arcus-cli"
version = "0.2.1"
description = "Adaptive routing, a quality gate, and a correctness-aware cache on top of Virginia Tech ARC's LLM API"
readme = "README.md"
license = "MIT"
authors = [{ name = "Shakir Farhan" }]
requires-python = ">=3.13"
keywords = ["llm", "cli", "routing", "bandit", "arc", "virginia-tech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    # ARC's file-upload endpoint isn't OpenAI-compatible, so it goes over
    # httpx directly rather than through the SDK. Declared explicitly
    # because we import it: recent openai versions depend on httpx2, a
    # separately named package, so `import httpx` is not something the
    # SDK guarantees for us.
    "httpx>=0.27",
    "numpy>=2.0",
    "openai",
    "platformdirs>=4.11.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "sqlmodel>=0.0.39",
    "typer>=0.27.1",
]

# sentence-transformers pulls in torch, which is most of a gigabyte on
# its own. It powers the semantic cache and the context classifier's
# fallback for prompts the regex rules don't match, and both degrade
# cleanly without it: the cache reports every question as a miss, the
# classifier leans on its rules. That isn't worth ~600MB in a default
# install of a CLI, so it lives here instead.
[project.optional-dependencies]
cache = ["sentence-transformers>=6.0.0"]

[project.urls]
Homepage = "https://github.com/ShakirFarhan/Arcus"
Repository = "https://github.com/ShakirFarhan/Arcus"
Issues = "https://github.com/ShakirFarhan/Arcus/issues"

[project.scripts]
arcus = "arcus.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcus"]

[tool.pytest.ini_options]
pythonpath = ["src"]
