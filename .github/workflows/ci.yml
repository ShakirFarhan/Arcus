name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        # --extra cache so the optional semantic-cache path is exercised
        # here rather than only on machines that happen to have torch.
        # The suite still passes without it, those tests just skip.
        run: uv sync --extra cache

      - name: Run tests
        run: uv run pytest tests/ -q
